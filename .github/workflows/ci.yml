name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - README.md
      - 'docs/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm --needed go git base-devel gcc pkgconf gtk3 gtk-layer-shell playerctl yt-dlp aspell hunspell gobject-introspection

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: archlinux-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            archlinux-go-

      - name: Check formatting
        run: |
          unformatted=$(find . -name '*.go' -not -path './.cache/*' -not -path './vendor/*' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            printf 'These files are not gofmt-formatted:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -mod=mod -buildvcs=false -ldflags="-s -w" -o edwin ./cmd/edwin/

      - name: Run tests
        run: go test -mod=mod ./...
