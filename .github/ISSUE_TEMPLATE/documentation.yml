name: Documentation
description: Something in the docs is wrong, missing, or unclear.
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The file and section, or a link to the line.
      placeholder: README.md — Dependencies
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional, but the fastest path to a fix.
